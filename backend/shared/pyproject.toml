[project]
name = "shared"
version = "1.0.0"
description = "Shared Redis client used by gateway, auth, and agent services"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]

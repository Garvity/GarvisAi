[project]
name = "agent"
version = "1.0.0"
description = "Agent service: LangGraph multi-agent (chat, search, coding, pdf, ppt, image, pdfRag, imageAnalyzer)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "beanie>=1.29,<2.0",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.20",
    "langgraph>=0.3",
    "langchain-core>=0.3",
    "langchain-groq>=0.3",
    "langchain-google-genai>=2.1",
    "langchain-openai>=0.3",
    "langchain-qdrant>=0.2",
    "langchain-tavily>=0.2",
    "langchain-text-splitters>=0.3",
    "qdrant-client>=1.13",
    "pypdf>=5.4",
    "reportlab>=4.3",
    "python-pptx>=1.0",
    "shared",
    "boto3>=1.43.53",
]

[tool.uv.sources]
shared = { path = "../../shared", editable = true }

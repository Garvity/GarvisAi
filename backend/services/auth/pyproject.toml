[project]
name = "auth"
version = "1.0.0"
description = "Auth service: Firebase login, Redis sessions, plan/credits updates"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "beanie>=1.29,<2.0",
    "firebase-admin>=6.6",
    "python-dotenv>=1.0",
    "shared",
]

[tool.uv.sources]
shared = { path = "../../shared", editable = true }
